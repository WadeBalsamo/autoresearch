[project]
name = "autoresearch-mindfulbert"
version = "0.2.0"
description = "Fine-tuning workshop: optimal fine-tuning of MindfulBERT (classification + NSP) and BioMistral on QRA outputs, single-GPU (RTX 3090)."
readme = "README.md"
requires-python = ">=3.10"

# Core (torch-free) deps — enough to run `common/`, `synth/`, `optimize/` and the
# torch-free test suite. The heavy DL stack lives in the [gpu] extra so the data
# contract / splits / metrics / synthetic-data tooling can be exercised on a CPU box.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Install on the 3090 box:  uv sync --extra gpu   (or pip install -e ".[gpu]")
gpu = [
    "torch>=2.3,<3",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "accelerate>=0.33",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "safetensors>=0.4",
    "rouge-score>=0.1.2",
]
# Optional: TRL SFT path for the generative track (the built-in loop does not need it)
trl = ["trl>=0.9"]
dev = ["pytest>=8.0"]

# --- torch wheel index --------------------------------------------------------
# Default to CUDA 12.4 wheels (broadly compatible incl. Ampere / RTX 3090, cc 8.6,
# and well-supported by bitsandbytes >=0.43). If your driver is older/newer, swap
# the URL to cu121 / cu128 and re-run `uv lock`. CPU-only: drop the [gpu] extra.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
